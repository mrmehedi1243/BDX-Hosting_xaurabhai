kind = "web"
previewPath = "/"
title = "BDX HOSTING"
version = "1.0.0"
id = "artifacts/bdx-hosting"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20856

[services.development]
run = "pnpm --filter @workspace/bdx-hosting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bdx-hosting", "run", "build" ]
publicDir = "artifacts/bdx-hosting/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20856"
BASE_PATH = "/"
